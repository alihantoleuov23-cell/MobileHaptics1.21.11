name: Build Mobile Haptics

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-haptics-source.zip'
      - '.github/workflows/build-mobile-haptics.yml'

env:
  GRADLE_VERSION: '9.2.1'
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -t mobile-haptics-source.zip
          unzip -q mobile-haptics-source.zip -d project

      - name: Build native Android bridge
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          test -x "$NDK/ndk-build"

          cd src/main/cpp

          "$NDK/ndk-build"             NDK_PROJECT_PATH=.             NDK_APPLICATION_MK=Application.mk

          cd ../../..

          mkdir -p src/main/resources/native/arm64-v8a
          mkdir -p src/main/resources/native/armeabi-v7a
          mkdir -p src/main/resources/native/x86
          mkdir -p src/main/resources/native/x86_64

          cp src/main/cpp/libs/arm64-v8a/libmobilevibration.so             src/main/resources/native/arm64-v8a/libmobilevibration.so

          cp src/main/cpp/libs/armeabi-v7a/libmobilevibration.so             src/main/resources/native/armeabi-v7a/libmobilevibration.so

          cp src/main/cpp/libs/x86/libmobilevibration.so             src/main/resources/native/x86/libmobilevibration.so

          cp src/main/cpp/libs/x86_64/libmobilevibration.so             src/main/resources/native/x86_64/libmobilevibration.so

      - name: Check native libraries
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          test -s src/main/resources/native/arm64-v8a/libmobilevibration.so
          test -s src/main/resources/native/x86_64/libmobilevibration.so
          test -s src/main/resources/native/armeabi-v7a/libmobilevibration.so
          test -s src/main/resources/native/x86/libmobilevibration.so

      - name: Build mod
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: MobileHaptics-1.21.11
          path: project/build/libs/*.jar

name: Build Mobile Haptics

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-haptics-source.zip'
      - '.github/workflows/build-mobile-haptics.yml'

env:
  GRADLE_VERSION: '9.2.1'
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q mobile-haptics-source.zip -d project

      - name: Build native Android bridge
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          test -x "$CLANG"

          mkdir -p src/main/resources/native/arm64-v8a
          mkdir -p src/main/resources/native/x86_64

          "$CLANG" \
            --target=aarch64-linux-android24 \
            -shared -fPIC -O2 \
            src/main/cpp/mobilehaptics.c \
            -o src/main/resources/native/arm64-v8a/libmobilehaptics.so

          "$CLANG" \
            --target=x86_64-linux-android24 \
            -shared -fPIC -O2 \
            src/main/cpp/mobilehaptics.c \
            -o src/main/resources/native/x86_64/libmobilehaptics.so

      - name: Build mod
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: MobileHaptics-1.21.11
          path: project/build/libs/*.jar
